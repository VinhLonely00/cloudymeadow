<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudyMeadow - Danh Sách Vật Phẩm</title>
    
    <link rel="icon" href="favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
    <style>
        .fish-section {
            padding: 120px 20px 60px;
            max-width: 1300px;
            margin: 0 auto;
            min-height: 80vh;
        }

        .table-wrapper {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow-x: auto;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            margin-top: 30px;
        }

        .fish-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-family: 'Inter', sans-serif;
            color: #e0e0e0;
        }

        .fish-table th {
            background: rgba(255, 255, 255, 0.05);
            font-family: 'Oswald', sans-serif;
            font-size: 1.05rem;
            color: #7ec2eb;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 16px 20px;
            border-bottom: 2px solid rgba(126, 194, 235, 0.3);
        }

        .fish-table td {
            padding: 14px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.95rem;
            vertical-align: middle;
        }

        .fish-table tr:hover {
            background: rgba(255, 255, 255, 0.03);
            transition: background 0.2s ease;
        }

        /* Ô chứa ảnh hiển thị sẵn */
        .image-preview-box {
            width: 100px;
            height: 75px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            background: rgba(255, 255, 255, 0.02);
            transition: all 0.25s ease;
            overflow: hidden;
            margin: 0 auto;
            padding: 4px;
        }

        .image-preview-box:hover {
            border-color: #7ec2eb;
            transform: scale(1.03);
        }

        .image-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
        }

        /* Nút Nhấp vào để xem */
        .btn-view {
            margin-top: 6px;
            background: transparent;
            color: #7ec2eb;
            border: 1px solid rgba(126, 194, 235, 0.4);
            padding: 4px 8px;
            font-size: 0.7rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-view:hover {
            background: #7ec2eb;
            color: #141414;
        }

        /* Modal Phóng To Ảnh Full */
        .full-img-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .full-img-container {
            position: relative;
            max-width: 90%;
            max-height: 90%;
        }

        .full-img-container img {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border: 2px solid rgba(255,255,255,0.2);
        }

        .close-btn {
            position: absolute;
            top: -35px;
            right: 0;
            color: #fff;
            font-size: 1.8rem;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            text-decoration: none;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
            margin-bottom: 20px;
            transition: color 0.2s;
        }
        .btn-back:hover { color: #7ec2eb; }
    </style>
</head>
<body>

    <div class="particles-container" id="particles"></div>
    <div class="bg-vignette"></div>

    <nav class="navbar">
        <a href="index.html" class="nav-logo" id="nav-logo-text">Cloudy<span>Meadow</span></a>
        <ul class="nav-menu">
            <li><a href="index.html#hero">TRANG CHỦ</a></li>
            <li><a href="index.html#staff">ĐỘI NGŨ</a></li>
            <li><a href="index.html#rules">LUẬT</a></li>
            <li><a href="index.html#faq">CÁCH CHƠI</a></li>
            <li><a href="#" style="color: #7ec2eb; font-weight: 700; text-transform: uppercase;">CÂU CÁ</a></li>
            <li><a href="enchant.html">PHÙ PHÉP</a></li>
        </ul>
    </nav>

    <section class="fish-section">
        <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Quay lại trang chủ</a>
        
        <div class="section-header">
            <h2>DANH SÁCH VẬT PHẨM</h2>
            <div class="gold-line"></div>
        </div>

        <div class="table-wrapper">
            <table class="fish-table">
                <thead>
                    <tr>
                        <th style="width: 60px; text-align: center;">STT</th>
                        <th>Vật phẩm</th>
                        <th>Tác Dụng</th>
                        <th style="width: 140px; text-align: center;">Hình Ảnh</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Tự động khởi tạo bằng JavaScript -->
                </tbody>
            </table>
        </div>
    </section>

    <!-- Modal Phóng To Ảnh Full -->
    <div class="full-img-modal" id="fullImgModal" onclick="closeFullImg()">
        <div class="full-img-container" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="closeFullImg()">&times;</span>
            <img id="fullImgTarget" src="" alt="Full Image">
        </div>
    </div>

    <footer>
        <p class="copyright">&copy; 2026 <span id="footer-name">CloudyMeadow</span>. All Rights Reserved.</p>
    </footer>

    <script>
        // Danh sách vật phẩm cố định kèm đường dẫn ảnh
        const items = [
            { id: 1, name: "Pháo Chùm", desc: "Bắn ra chùm đạn gây sát thương diện rộng.", img: "images/Chum.png" },
            { id: 2, name: "Pháo Hạt Nhân", desc: "Tạo vụ nổ lớn công suất cao.", img: "images/Nuke.png" },
            { id: 3, name: "Bộ đồ da (giảm sát thương ngang netherit)", desc: "Tăng giáp bảo vệ tương đương giáp Netherite.", img: "images/Giap.png" },
            { id: 4, name: "Tất cả các loại động vật", desc: "Các loài sinh vật hiền lành, triệu hồi/thu phục.", img: "images/Animal.png" },
            { id: 5, name: "Tất cả các loại quái vật (trừ boss)", desc: "Các sinh vật hung dữ, thử thách người chơi.", img: "images/Monster.png" },
            { id: 6, name: "Vanilla", desc: "Vật phẩm gốc mặc định.", img: "images/vanilla.png" },
            { id: 7, name: "Nhân Ngư", desc: "Tăng khả năng bơi lội và thở dưới nước.", img: "images/nhanngu.png" },
            { id: 8, name: "Spiderman", desc: "Bắn tơ, leo tường và di chuyển nhanh.", img: "images/Spiderman.png" },
            { id: 9, name: "Point", desc: "Điểm thưởng dùng để đổi quà/nâng cấp.", img: "images/point.png" },
            { id: 10, name: "Các loại quặng (trừ netherit)", desc: "Khoáng sản dùng để chế tạo thiết bị, công cụ.", img: "images/ores.png" }
        ];

        const tbody = document.querySelector('.fish-table tbody');

        items.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="text-align: center;">${item.id}</td>
                <td><strong>${item.name}</strong></td>
                <td>${item.desc}</td>
                <td style="text-align: center;">
                    <div class="image-preview-box" onclick="openFullImg('${item.img}')">
                        <img class="image-preview" src="${item.img}" alt="${item.name}">
                    </div>
                    <button class="btn-view" onclick="openFullImg('${item.img}')">
                        <i class="fas fa-search-plus"></i> Nhấp vào để xem
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        function openFullImg(src) {
            document.getElementById('fullImgTarget').src = src;
            document.getElementById('fullImgModal').style.display = 'flex';
        }

        function closeFullImg() {
            document.getElementById('fullImgModal').style.display = 'none';
        }
    </script>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
