<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudyMeadow - Danh Sách Vật Phẩm</title>
    
    <link rel="icon" href="favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
    <style>
        .fish-section {
            padding: 120px 20px 60px;
            max-width: 1300px;
            margin: 0 auto;
            min-height: 80vh;
        }

        .table-wrapper {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow-x: auto;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            margin-top: 30px;
        }

        .fish-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-family: 'Inter', sans-serif;
            color: #e0e0e0;
        }

        .fish-table th {
            background: rgba(255, 255, 255, 0.05);
            font-family: 'Oswald', sans-serif;
            font-size: 1.05rem;
            color: #7ec2eb;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 16px 20px;
            border-bottom: 2px solid rgba(126, 194, 235, 0.3);
        }

        .fish-table td {
            padding: 14px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.95rem;
            vertical-align: middle;
        }

        .fish-table tr:hover {
            background: rgba(255, 255, 255, 0.03);
            transition: background 0.2s ease;
        }

        /* Ô chứa ảnh dạng Drag & Drop / Nhấp Vào */
        .image-upload-box {
            width: 100px;
            height: 75px;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            background: rgba(255, 255, 255, 0.02);
            transition: all 0.25s ease;
            overflow: hidden;
            margin: 0 auto;
            padding: 4px;
        }

        /* Khi di chuột vào sẽ chuyển sang MÀU ĐỎ */
        .image-upload-box:hover {
            border-color: #ff4d4d;
            background: rgba(255, 77, 77, 0.1);
        }

        .image-upload-box i {
            font-size: 1.1rem;
            color: #e0e0e0;
            margin-bottom: 3px;
            transition: color 0.25s ease;
        }

        .image-upload-box .btn-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: #e0e0e0;
            transition: color 0.25s ease;
            text-align: center;
            line-height: 1.2;
            user-select: none;
        }

        /* Đổi màu icon và chữ thành MÀU ĐỎ khi hover */
        .image-upload-box:hover i,
        .image-upload-box:hover .btn-label {
            color: #ff4d4d;
        }

        /* Kích thước ảnh xem trước */
        .image-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .action-btns {
            margin-top: 8px;
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .btn-action {
            padding: 4px 8px;
            font-size: 0.7rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .btn-change { background: #e67e22; color: #fff; }
        .btn-save { background: #2ecc71; color: #fff; }
        .btn-action:hover { opacity: 0.85; }

        /* Modal Phóng To Ảnh Full */
        .full-img-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .full-img-container {
            position: relative;
            max-width: 90%;
            max-height: 90%;
        }

        .full-img-container img {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border: 2px solid rgba(255,255,255,0.2);
        }

        .close-btn {
            position: absolute;
            top: -35px;
            right: 0;
            color: #fff;
            font-size: 1.8rem;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            text-decoration: none;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
            margin-bottom: 20px;
            transition: color 0.2s;
        }
        .btn-back:hover { color: #7ec2eb; }
    </style>
</head>
<body>

    <div class="particles-container" id="particles"></div>
    <div class="bg-vignette"></div>

    <nav class="navbar">
        <a href="index.html" class="nav-logo" id="nav-logo-text">Cloudy<span>Meadow</span></a>
        <ul class="nav-menu">
            <li><a href="index.html#hero">TRANG CHỦ</a></li>
            <li><a href="index.html#staff">ĐỘI NGŨ</a></li>
            <li><a href="index.html#rules">LUẬT</a></li>
            <li><a href="index.html#faq">CÁCH CHƠI</a></li>
            <li><a href="#" style="color: #7ec2eb; font-weight: 700; text-transform: uppercase;">VẬT PHẨM</a></li>
            <li><a href="enchant.html">PHÙ PHÉP</a></li>
        </ul>
    </nav>

    <section class="fish-section">
        <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Quay lại trang chủ</a>
        
        <div class="section-header">
            <h2>DANH SÁCH VẬT PHẨM</h2>
            <div class="gold-line"></div>
        </div>

        <div class="table-wrapper">
            <table class="fish-table">
                <thead>
                    <tr>
                        <th style="width: 60px; text-align: center;">STT</th>
                        <th>Vật phẩm</th>
                        <th>Tác Dụng</th>
                        <th style="width: 140px; text-align: center;">Hình Ảnh</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Tự động khởi tạo bằng JavaScript -->
                </tbody>
            </table>
        </div>
    </section>

    <!-- Modal Phóng To Ảnh Full -->
    <div class="full-img-modal" id="fullImgModal" onclick="closeFullImg()">
        <div class="full-img-container" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="closeFullImg()">&times;</span>
            <img id="fullImgTarget" src="" alt="Full Image">
        </div>
    </div>

    <footer>
        <p class="copyright">&copy; 2026 <span id="footer-name">CloudyMeadow</span>. All Rights Reserved.</p>
    </footer>

    <script>
        const items = [
            { id: 1, name: "Pháo Chùm", desc: "Bắn ra chùm đạn gây sát thương diện rộng." },
            { id: 2, name: "Pháo Hạt Nhân", desc: "Tạo vụ nổ lớn công suất cao." },
            { id: 3, name: "Bộ đồ da (giảm sát thương ngang netherit)", desc: "Tăng giáp bảo vệ tương đương giáp Netherite." },
            { id: 4, name: "Tất cả các loại động vật", desc: "Các loài sinh vật hiền lành, triệu hồi/thu phục." },
            { id: 5, name: "Tất cả các loại quái vật (trừ boss)", desc: "Các sinh vật hung dữ, thử thách người chơi." },
            { id: 6, name: "Vanilla", desc: "Vật phẩm gốc mặc định." },
            { id: 7, name: "Nhân Ngư", desc: "Tăng khả năng bơi lội và thở dưới nước." },
            { id: 8, name: "Spiderman", desc: "Bắn tơ, leo tường và di chuyển nhanh." },
            { id: 9, name: "Point", desc: "Điểm thưởng dùng để đổi quà/nâng cấp." },
            { id: 10, name: "Các loại quặng (trừ netherit)", desc: "Khoáng sản dùng để chế tạo thiết bị, công cụ." }
        ];

        const tbody = document.querySelector('.fish-table tbody');

        items.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="text-align: center;">${item.id}</td>
                <td><strong>${item.name}</strong></td>
                <td>${item.desc}</td>
                <td style="text-align: center;">
                    <div class="image-upload-box" id="box-${item.id}" onclick="handleBoxClick(${item.id})">
                        <i class="fas fa-cloud-upload-alt" id="icon-${item.id}"></i>
                        <span class="btn-label" id="label-${item.id}">Kéo thả ảnh<br>hoặc Nhấp vào</span>
                        <img id="preview-${item.id}" class="image-preview">
                    </div>
                    <input type="file" id="file-${item.id}" accept="image/*" style="display:none;" onchange="handleFileSelect(event, ${item.id})">
                    <div class="action-btns" id="controls-${item.id}">
                        <button class="btn-action btn-change" style="display:none;" onclick="triggerFileInput(${item.id})">Đổi ảnh</button>
                        <button class="btn-action btn-save" style="display:none;" onclick="lockItem(${item.id})">Lưu khóa</button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);

            // Gắn sự kiện Kéo & Thả (Drag & Drop)
            setTimeout(() => {
                const box = document.getElementById(`box-${item.id}`);
                box.addEventListener('dragover', (e) => { 
                    e.preventDefault(); 
                    box.style.borderColor = '#ff4d4d'; 
                });
                box.addEventListener('dragleave', () => { 
                    box.style.borderColor = 'rgba(255, 255, 255, 0.3)'; 
                });
                box.addEventListener('drop', (e) => {
                    e.preventDefault();
                    box.style.borderColor = 'rgba(255, 255, 255, 0.3)';
                    if (!isLocked[item.id] && e.dataTransfer.files && e.dataTransfer.files[0]) {
                        processImage(e.dataTransfer.files[0], item.id);
                    }
                });
            }, 0);
        });

        let isLocked = {};
        let imageData = {};

        function handleBoxClick(id) {
            if (imageData[id]) {
                openFullImg(imageData[id]);
            } else if (!isLocked[id]) {
                triggerFileInput(id);
            }
        }

        function triggerFileInput(id) {
            if (!isLocked[id]) {
                document.getElementById(`file-${id}`).click();
            }
        }

        function handleFileSelect(e, id) {
            if (e.target.files && e.target.files[0]) {
                processImage(e.target.files[0], id);
            }
        }

        function processImage(file, id) {
            const reader = new FileReader();
            reader.onload = (e) => {
                imageData[id] = e.target.result;
                
                const box = document.getElementById(`box-${id}`);
                const img = document.getElementById(`preview-${id}`);
                const label = document.getElementById(`label-${id}`);
                const icon = document.getElementById(`icon-${id}`);
                
                img.src = imageData[id];
                img.style.display = 'block';

                // Ẩn văn bản & icon kéo thả khi đã chọn ảnh
                label.style.display = 'none';
                icon.style.display = 'none';
                box.style.borderStyle = 'solid';

                // Hiển thị các nút thao tác "Đổi ảnh" & "Lưu khóa"
                const controls = document.getElementById(`controls-${id}`);
                controls.querySelectorAll('button').forEach(btn => btn.style.display = 'inline-block');
            };
            reader.readAsDataURL(file);
        }

        function lockItem(id) {
            isLocked[id] = true;
            document.getElementById(`file-${id}`).disabled = true;

            const box = document.getElementById(`box-${id}`);
            box.style.borderColor = 'rgba(255, 255, 255, 0.2)';

            // Khóa lại và chỉ cho phép nhấp vào để xem Full ảnh
            const controls = document.getElementById(`controls-${id}`);
            controls.innerHTML = '<span style="color:#2ecc71; font-size:0.75rem; font-weight:600;"><i class="fas fa-lock"></i> Đã khóa</span>';
        }

        function openFullImg(src) {
            document.getElementById('fullImgTarget').src = src;
            document.getElementById('fullImgModal').style.display = 'flex';
        }

        function closeFullImg() {
            document.getElementById('fullImgModal').style.display = 'none';
        }
    </script>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
